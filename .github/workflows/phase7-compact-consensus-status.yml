name: Phase 7 GenLayer consensus lifecycle readonly
on:
  push:
    branches: [test/phase7-compact-bradbury-20261015]
    paths:
      - 'tools/phase7_compact_consensus_status.py'
      - '.github/workflows/phase7-compact-consensus-status.yml'
permissions:
  contents: read
jobs:
  consensus-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check genlayer-py==0.19.0rc2
      - run: python tools/phase7_compact_consensus_status.py
