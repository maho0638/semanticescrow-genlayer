name: SemanticEscrow Phase 7 official GenVM v0.2.16 packaged runner attestation
on:
  push:
    branches: [test/phase7-bradbury-runtime-compat-20261015]
    paths:
      - '.github/workflows/phase7-official-v0216-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download immutable official GenVM v0.2.16 universal release
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz'
          curl --fail --location --retry 3 --retry-delay 2 --max-time 720 \
            --silent --show-error "$URL" -o /tmp/se-genvm-official-v0216.tar.xz
          # Digest copied from GitHub release v0.2.16 asset metadata.
          echo '4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2  /tmp/se-genvm-official-v0216.tar.xz' | sha256sum --check
          echo 'SE7_OFFICIAL_PACKAGED_RELEASE_SHA256_PASS'
      - name: Locate pinned runner inside verified official package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          p='/tmp/se-genvm-official-v0216.tar.xz'
          result=subprocess.run(['tar','-tJf',p],capture_output=True,text=True,check=True)
          files=result.stdout.splitlines()
          pin='1jb45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6'
          matches=[x for x in files if 'py-genlayer' in x and pin in x.replace('/','')]
          print('SE7_PACKAGED_TOTAL_ENTRIES',len(files))
          print('SE7_PACKAGED_RUNNER_PIN_MATCHES',len(matches))
          for entry in matches[:5]:
              print('SE7_PACKAGED_PIN_PATH',entry[:240])
          if not matches:
              nearby=[x for x in files if 'py-genlayer' in x]
              print('SE7_PACKAGED_PY_GENLAYER_ENTRIES',len(nearby))
              for entry in nearby[:8]:
                  print('SE7_PACKAGED_PY_GENLAYER_PATH',entry[:240])
              raise SystemExit('pinned runner not found in official release listing')
          PY
          echo 'SE7_OFFICIAL_PACKAGED_RUNNER_PIN_PRESENT (does not attest Bradbury validator deployment)'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: |
          python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Extract official packaged runner rather than reconstructing its source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/se-official-genvm
          tar -xJf /tmp/se-genvm-official-v0216.tar.xz -C /tmp/se-official-genvm
          test -s '/tmp/se-official-genvm/runners/py-genlayer/1j/b45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6.tar'
          echo "GENVM_PREBUILT_DIR=/tmp/se-official-genvm" >> "$GITHUB_ENV"
          echo "SEMANTICESCROW_SDK_0_2_EMULATION=1" >> "$GITHUB_ENV"
          echo 'SE7_PINNED_RUNNER_BYTES_FROM_OFFICIAL_PACKAGE'
      - name: Recheck pinned contract against official packaged runner in Direct Mode
        shell: bash
        run: |
          set -euo pipefail
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m pytest -q tests/test_phase7_legacy_web_probe.py
          python -m pytest -q --maxfail=1 tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
          python -m pytest -q tests/test_phase7_legacy_receipts.py tests/test_phase7_legacy_compat.py tests/test_phase7_deploy_preflight.py tests/test_phase7_schema_compat.py tests/test_phase7_legacy_sdk_path.py tests/test_phase7_rpc_diagnostics.py tests/test_phase7_evm_receipt.py tests/test_phase7_windows_relay.py tests/test_phase7_external_safety_order.py
          echo 'SE7_OFFICIAL_PACKAGED_DIRECT_MODE_TESTS_PASS (not native distributed GenVM)'
