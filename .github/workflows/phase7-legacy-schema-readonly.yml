name: SemanticEscrow Phase7 Bradbury old runner schema validation
on:
  push:
    branches: [test/phase7-bradbury-runtime-compat-20261015]
    paths:
      - '.github/workflows/phase7-legacy-schema-readonly.yml'
      - 'contracts/semantic_escrow.py'
      - 'tools/phase7_schema_compat.py'
permissions:
  contents: read
jobs:
  compile-pinned-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runner
        run: python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Compile exact compact source on official Studio-dev without wallet writes
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          gltest tests/test_phase7_schema_live.py -q -s --network testnet_bradbury
