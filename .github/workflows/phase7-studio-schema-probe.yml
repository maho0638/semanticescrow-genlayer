name: SemanticEscrow Phase 7 hosted Studio schema readonly probe
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - tools/phase7_studio_schema_probe.py
      - .github/workflows/phase7-studio-schema-probe.yml
permissions:
  contents: read
jobs:
  studio-schema-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python tools/phase7_studio_schema_probe.py
