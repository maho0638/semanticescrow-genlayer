name: SemanticEscrow Phase7 compact Bradbury proof build
on:
  push:
    branches: [test/phase7-compact-bradbury-20261015]
    paths:
      - .github/workflows/phase7-build-compact.yml
      - tests/test_phase7_deploy_preflight.py
permissions:
  contents: write
jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test and minification dependencies
        run: python -m pip install --disable-pip-version-check python-minifier==3.4.0 genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Generate smaller exact ABI source and update independent source-hash gate
        run: |
          python tools/phase7_make_compact_candidate.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          h=hashlib.sha256(Path("contracts/semantic_escrow.py").read_bytes()).hexdigest()
          expected="24cee2dd31e38cde646911fb5ae6ca1c0f46b82b8349ea4919199119115a94d5"
          if h!=expected: raise SystemExit("Unexpected compact candidate SHA256")
          path=Path("tools/phase7_schema_compat.py")
          contents=path.read_text(encoding="utf-8")
          original="4fae50929d9e98e1d166661acaac120d5153e5dd8ca1b203a444475330223b66"
          if contents.count(original)!=1: raise SystemExit("Schema hash pin patch not safe")
          path.write_text(contents.replace(original,h),encoding="utf-8")
          print("SE7_PACKED_DEPLOY_HASH_PIN_OK",h)
          PY
      - name: Compile source and verify all 153 behavioral tests without changing main
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m compileall -q contracts tests tools/phase7_deploy_preflight.py
          genvm-lint lint contracts/semantic_escrow.py --json
          python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
          python -m pytest -q tests/test_phase7_deploy_preflight.py tests/test_phase7_legacy_compat.py tests/test_phase7_schema_compat.py tests/test_phase7_legacy_sdk_path.py tests/test_phase7_rpc_diagnostics.py tests/test_phase7_evm_receipt.py tests/test_phase7_windows_relay.py
      - name: Read-only Bradbury simulated deploy with a safe sub-15M gas cap
        run: python -m tools.phase7_compact_onchain_smoke
      - name: Commit validated compact candidate ONLY to named isolated test branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/semantic_escrow.py tools/phase7_schema_compat.py
          git commit -m 'test(phase7): 15.8KB behavior-verified GenVM contract below Bradbury gas gate'
          header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/test/phase7-compact-bradbury-20261015
