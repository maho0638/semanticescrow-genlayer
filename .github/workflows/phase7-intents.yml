name: SemanticEscrow Phase 7 queued-intent accounting (local safety checks)
on:
  push:
    branches: [audit/phase7-settlement-intents-20261015]
    paths: [contracts/**, tests/**, tools/**, .github/workflows/phase7-intents.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned SDK test versions
        run: python -m pip install genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 pytest==9.1.1
      - name: Compile and pinned GenVM semantic lint
        run: |
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: All historical and phase 7 intent regressions
        run: python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
      - name: Phase 1 design and abstract ledgers
        run: node tools/check_phase1_design.mjs
