name: Phase 3 Python test collection preflight
on:
  push:
    branches: [test/phase3-five-validators-20261015]
    paths:
      - '.github/workflows/phase3-preflight.yml'
      - 'tests/test_studio_phase3.py'
permissions:
  contents: read
jobs:
  syntax-and-collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install genlayer-test==0.30.0rc2 cloudpickle==3.1.2 pytest==9.1.1
      - run: python -m compileall -q tests/test_studio_phase3.py
      - run: pytest --collect-only -q tests/test_studio_phase3.py
      - name: Verify real gltest CLI collection path without network writes
        env:
          SEMANTICESCROW_RUN_STUDIO: '0'
        run: gltest tests/test_studio_phase3.py -v -s --network localnet

