name: SemanticEscrow 2-GEN run chain verification
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - tools/phase7_last_trial_readonly.py
      - .github/workflows/phase7-last-trial-readonly.yml
permissions:
  contents: read
jobs:
  chain-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python tools/phase7_last_trial_readonly.py
