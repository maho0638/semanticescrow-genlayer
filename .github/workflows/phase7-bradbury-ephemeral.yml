name: SemanticEscrow ephemeral Bradbury Ghost escrow test
on:
  push:
    branches: [test/phase7-bradbury-ephemeral-20261015]
    paths:
      - tools/phase7_bradbury_ephemeral.py
      - tests/test_phase7_bradbury_external.py
      - .github/workflows/phase7-bradbury-ephemeral.yml
      - gltest.config.yaml
permissions:
  contents: write
jobs:
  testnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: python -m pip install genlayer-test==0.30.0rc2 eth-account==0.14.0 requests==2.32.5
      - name: Compile ephemeral scripts
        run: python -m compileall -q tools/phase7_bradbury_ephemeral.py tests/test_phase7_bradbury_external.py
      - name: Test with transient memory-only wallet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/phase7_bradbury_ephemeral.py
