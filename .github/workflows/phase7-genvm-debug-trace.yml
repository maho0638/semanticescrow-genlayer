name: Bradbury GenVM failed create-deal debug trace (read-only)
on:
  push:
    branches: [fix/phase7-create-deal-root-cause-20261016]
    paths:
      - '.github/workflows/phase7-genvm-debug-trace.yml'
      - 'tools/phase7_genvm_debug_trace.py'
      - 'tools/phase7_exact_failed_calldata.py'
      - 'tools/phase7_genvm_trace_windows.py'
      - 'tests/test_phase7_genvm_windows_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public GenVM trace (no wallet, no submission)
        run: python tools/phase7_genvm_debug_trace.py
      - name: Inspect v0.6 immutable calldata without replay
        run: |
          python -m pip install --disable-pip-version-check eth-abi==5.2.0 eth-utils==5.3.0 requests==2.32.5 pycryptodome==3.23.0 rlp==4.1.0
          python tools/phase7_exact_failed_calldata.py
      - name: Verify Windows diagnostic avoids fabricated errors and secrets
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 genlayer-test==0.30.0rc2
          python -m compileall -q tools/phase7_genvm_trace_windows.py
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          python -m pytest -q tests/test_phase7_genvm_windows_trace.py
