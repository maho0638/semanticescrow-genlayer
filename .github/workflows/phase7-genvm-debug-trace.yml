name: Bradbury GenVM failed create-deal debug trace (read-only)
on:
  push:
    branches: [fix/phase7-create-deal-root-cause-20261016]
    paths:
      - '.github/workflows/phase7-genvm-debug-trace.yml'
      - 'tools/phase7_genvm_debug_trace.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public GenVM trace (no wallet, no submission)
        run: python tools/phase7_genvm_debug_trace.py
