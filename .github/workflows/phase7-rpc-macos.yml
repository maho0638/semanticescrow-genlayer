name: SemanticEscrow Phase 7 macOS RPC reachability
on:
  push:
    branches: [test/phase7-bradbury-ephemeral-20261015]
    paths:
      - .github/workflows/phase7-rpc-macos.yml
permissions:
  contents: read
jobs:
  mac-rpc-preflight:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python tools/phase7_rpc_diag.py
