name: SemanticEscrow ephemeral test-wallet public RPC probe
on:
  push:
    branches: [test/ephemeral-wallet-rpc-20261015]
    paths:
      - .github/workflows/ephemeral-wallet-rpc.yml
      - tools/ephemeral_wallet_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporary-test-wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated public wallet/RPC libraries
        run: python -m pip install --disable-pip-version-check eth-account==0.14.0 requests==2.32.5
      - name: Compile probe and execute temporary test wallets
        run: |
          python -m py_compile tools/ephemeral_wallet_probe.py
          python tools/ephemeral_wallet_probe.py
