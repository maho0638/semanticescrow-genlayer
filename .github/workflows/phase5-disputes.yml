name: SemanticEscrow Phase 5 dispute + challenge security
on:
  push:
    branches:
      - audit/phase5-dispute-appeal-20261015
    paths:
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/phase5-disputes.yml'
      - 'spec/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-and-direct-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned GenVM tooling
        run: python -m pip install genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 pytest==9.1.1
      - name: Python syntax / GenVM lint
        run: |
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: All original finance + new dispute Direct Mode regressions
        run: python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py
      - name: Read-only design consistency
        run: node tools/check_phase1_design.mjs
