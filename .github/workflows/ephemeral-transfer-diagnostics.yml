name: SemanticEscrow read-only ephemeral transfer reconciliation
on:
  push:
    branches: [test/ephemeral-wallet-rpc-20261015]
    paths:
      - tools/ephemeral_transfer_diagnostics.py
      - .github/workflows/ephemeral-transfer-diagnostics.yml
permissions:
  contents: read
jobs:
  inspect-public-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check public Studio receipts and balances without any signing key
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5
          python tools/ephemeral_transfer_diagnostics.py
