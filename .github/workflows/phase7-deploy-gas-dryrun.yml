name: SemanticEscrow Phase 7 deployment gas estimate replay (read-only)
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - tools/phase7_deploy_gas_dryrun.py
      - .github/workflows/phase7-deploy-gas-dryrun.yml
permissions:
  contents: read
jobs:
  estimate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check genlayer-py==0.19.0rc2 eth-account==0.14.0 requests==2.32.5
      - run: python -m tools.phase7_deploy_gas_dryrun
