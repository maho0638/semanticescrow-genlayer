name: SemanticEscrow Phase 7 compact candidate full regression
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - 'tools/phase7_make_compact_candidate.py'
      - '.github/workflows/phase7-compact-candidate.yml'
permissions:
  contents: read
jobs:
  validate-minified-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1 python-minifier==3.4.0
      - name: Generate candidate in ephemeral CI directory
        run: python tools/phase7_make_compact_candidate.py
      - name: Compile, lint and prove unchanged behavior
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
          python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
