name: SemanticEscrow Phase7 compact runner offline regression
on:
  push:
    branches: [test/phase7-compact-bradbury-20261015]
    paths:
      - 'tests/test_phase7_bradbury_external.py'
      - 'tests/test_phase7_external_safety_order.py'
      - '.github/workflows/phase7-compact-runner.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 cloudpickle==3.1.2 pytest==9.1.1
      - run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m pytest -q tests/test_phase7_external_safety_order.py
      - run: python -m compileall -q tools/phase7_bradbury_windows.py tests/test_phase7_bradbury_external.py
