name: SemanticEscrow Phase 7 Windows preflight
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - 'scripts/**'
      - 'tools/phase7_bradbury_windows.py'
      - 'tools/phase7_windows_rpc_bridge.py'
      - 'tests/test_phase7_windows_relay.py'
      - 'tests/test_phase7_bradbury_external.py'
      - 'tests/test_phase7_bradbury_readonly.py'
      - 'gltest.config.yaml'
      - '.github/workflows/phase7-windows-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned local test tools
        run: python -m pip install genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Syntax lint and 153 historical and phase-7 tests
        run: |
          python -m compileall -q contracts tests tools/phase7_bradbury_windows.py
          genvm-lint lint contracts/semantic_escrow.py --json
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m pytest -q tests/test_phase7_windows_relay.py
          python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
