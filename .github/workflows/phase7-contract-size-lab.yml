name: SemanticEscrow Phase 7 no-spend code-size lab
on:
  push:
    branches: [test/phase7-windows-bradbury-20261015]
    paths:
      - 'tools/phase7_contract_size_lab.py'
      - '.github/workflows/phase7-contract-size-lab.yml'
permissions:
  contents: read
jobs:
  measure-real-testnet-gas:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'python-minifier==3.4.0' 'genlayer-py==0.19.0rc2' 'eth-account==0.14.0' 'requests==2.32.5'
      - run: python -m tools.phase7_contract_size_lab
