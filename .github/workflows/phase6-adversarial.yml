name: SemanticEscrow Phase 6 adversarial evidence and validators
on:
  push:
    branches: [audit/phase6-evidence-validators-20261015]
    paths: [contracts/**, tests/**, .github/workflows/phase6-adversarial.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-security-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned version dependencies
        run: python -m pip install genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 pytest==9.1.1
      - name: Python and GenVM semantic lint
        run: |
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: Full historical and hostile-source consensus regression
        run: python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py
      - name: Phase-1 static design accounting proof
        run: node tools/check_phase1_design.mjs
