name: SemanticEscrow Phase 7 legacy runner offline checks
on:
  push:
    branches: [test/phase7-bradbury-runtime-compat-20261015]
    paths:
      - 'contracts/semantic_escrow.py'
      - 'tools/phase7_schema_compat.py'
      - 'tests/test_phase5_disputes.py'
      - 'tests/conftest.py'
      - '.github/workflows/phase7-legacy-runner-tests.yml'
permissions:
  contents: read
jobs:
  validate-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned testing dependencies
        run: python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Check source pin, compile and GenVM lint
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          s=Path('contracts/semantic_escrow.py').read_bytes()
          from tools.phase7_schema_compat import SOURCE_SHA256
          assert hashlib.sha256(s).hexdigest()==SOURCE_SHA256, 'SHA-256 source mismatch'
          assert s.startswith(b'# v0.2.16\n# { "Depends": "py-genlayer:1jb45aa8')
          assert b'gl.vm.run_nondet_unsafe(k,n)' in s
          print('SE7_LEGACY_SOURCE_SHA_PIN_PASS')
          PY
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: Obtain official, pinned GenVM v0.2.16 runtime for Direct Mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.legacy-genvm"
          curl -fL --retry 2 --connect-timeout 20 --max-time 150 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-linux-amd64.tar.xz \
            -o /tmp/genvm-v0216.tar.xz
          tar -tJf /tmp/genvm-v0216.tar.xz | grep -E '(runners|py-genlayer)' | head -n 12 || true
          tar -xJf /tmp/genvm-v0216.tar.xz -C "$PWD/.legacy-genvm"
          found="$(find "$PWD/.legacy-genvm" -type f | grep '/py-genlayer/1j/b45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6' | head -n 1 || true)"
          if [ -z "$found" ]; then
            echo "SE7_LEGACY_RUNNER_MISSING_IN_RELEASE"
            exit 1
          fi
          echo "GENVM_PREBUILT_DIR=$PWD/.legacy-genvm" >> "$GITHUB_ENV"
          echo "SE7_LEGACY_RUNNER_RELEASE_VERIFIED"
      - name: Full direct-mode behavioral regression
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m pytest -q --maxfail=1 tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
          python -m pytest -q tests/test_phase7_legacy_compat.py tests/test_phase7_schema_compat.py tests/test_phase7_deploy_preflight.py tests/test_phase7_legacy_sdk_path.py tests/test_phase7_rpc_diagnostics.py tests/test_phase7_evm_receipt.py tests/test_phase7_windows_relay.py
