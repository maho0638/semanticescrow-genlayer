name: SemanticEscrow V2 attributed native GEN payout real EVM tests
on:
  push:
    branches: [feature/intent-bound-gen-payout-v2-20261016]
    paths:
      - 'contracts/semantic_escrow_attributed_v2.py'
      - 'contracts/evm/SemanticEscrowNativePayoutRouter.sol'
      - 'tests/test_v2_ic_router_source.py'
      - 'tests/test_v2_evm_payout_router.py'
      - 'tests/test_v2_genvm_direct.py'
      - 'tools/phase7_legacy_method_dispatch.py'
      - 'tests/test_phase7_method_dispatch_compat.py'
      - 'tools/v2_attributed_payout_proof.py'
      - 'tests/test_v2_attributed_payout_proof.py'
      - '.github/workflows/v2-attributed-payout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned testing dependencies
        run: python -m pip install --disable-pip-version-check genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 eth-account==0.14.0 requests==2.32.5 pytest==9.1.1
      - name: Check source pin, compile and GenVM lint
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          s=Path('contracts/semantic_escrow.py').read_bytes()
          from tools.phase7_schema_compat import SOURCE_SHA256
          assert hashlib.sha256(s).hexdigest()==SOURCE_SHA256, 'SHA-256 source mismatch'
          assert s.startswith(b'# v0.2.16\n# { "Depends": "py-genlayer:1jb45aa8')
          assert b'gl.vm.run_nondet_unsafe(k,n)' in s
          print('SE7_LEGACY_SOURCE_SHA_PIN_PASS')
          PY
          python -m compileall -q contracts tests tools/phase8_release_gate.py tools/phase8_ghost_public_probe.py tools/phase9_release_packet.py tools/child_delivery_recovery_guard.py tools/child_delivery_incident_cli.py tools/phase2_intent_child_correlator.py tools/phase2_public_parent_probe.py
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: Reconstruct disposable test-only SDK package from official v0.2.16 source
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse --branch v0.2.16 \
            https://github.com/genlayerlabs/genvm.git /tmp/se-genvm-legacy-source
          git -C /tmp/se-genvm-legacy-source sparse-checkout set runners/genlayer-py-std/src
          base="$PWD/.legacy-genvm/runners/py-genlayer/1j"
          mkdir -p "$base"
          tar -C /tmp/se-genvm-legacy-source/runners/genlayer-py-std -cf \
            "$base/b45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6.tar" src
          test -s "$base/b45aa8ynh2a9c9xn3b7qqh8sm5q93hwfp7jqmwsfhh8jpz09h6.tar"
          echo "GENVM_PREBUILT_DIR=$PWD/.legacy-genvm" >> "$GITHUB_ENV"
          echo "SEMANTICESCROW_SDK_0_2_EMULATION=1" >> "$GITHUB_ENV"
          echo "SE7_OFFICIAL_TAG_SOURCE_EMULATION_READY (not packaged runner hash verification)"
      - name: Full direct-mode behavioral regression
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account; print(Account.create().key.hex())')"
          python -m pytest -q -s tests/test_phase7_legacy_web_probe.py
          python -m pytest -q --maxfail=1 tests/test_phase2_contract.py tests/test_phase4_payment.py tests/test_phase5_disputes.py tests/test_phase6_adversarial.py tests/test_phase7_intents.py
          python -m pytest -q tests/test_phase7_legacy_receipts.py
          python -m pytest -q tests/test_phase7_legacy_compat.py tests/test_phase7_schema_compat.py tests/test_phase7_deploy_preflight.py tests/test_phase7_legacy_sdk_path.py tests/test_phase7_rpc_diagnostics.py tests/test_phase7_evm_receipt.py tests/test_phase7_windows_relay.py tests/test_phase7_external_safety_order.py tests/test_phase7_existing_bradbury.py
          python -m pytest -q tests/test_phase8_release_gate.py tests/test_phase8_ghost_public_probe.py tests/test_phase9_release_packet.py tests/test_child_delivery_recovery_guard.py tests/test_child_delivery_incident_cli.py tests/test_phase2_intent_child_correlator.py tests/test_phase2_public_parent_probe.py
          python -m pip check


      - name: Compile candidate GenVM v0.2.16 source (not currently deployed)
        run: |
          python -m py_compile contracts/semantic_escrow_attributed_v2.py tools/v2_attributed_payout_proof.py
          genvm-lint lint contracts/semantic_escrow_attributed_v2.py --json
      - name: Install pinned solc-js and in-memory EVM
        run: |
          npm install --no-save --no-audit --no-fund solc@0.8.24
          python -m pip install --disable-pip-version-check web3==7.14.0 eth-tester==0.13.0b1 py-evm==0.12.1b1
          python -m pip check
      - name: Actually execute replay-safe Solidity payout and invalid-recipient cases
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          python -m pytest -q --maxfail=1 tests/test_v2_ic_router_source.py tests/test_v2_evm_payout_router.py tests/test_v2_attributed_payout_proof.py
          echo SE_V2_EVM_ATOMIC_IDEMPOTENT_PAYMENT_TESTS_PASS

      - name: Execute actual pinned GenVM v2 constructor and deposit safety gate
        run: |
          export ACCOUNT_PRIVATE_KEY_1="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          export ACCOUNT_PRIVATE_KEY_2="$(python -c 'from eth_account import Account;print(Account.create().key.hex())')"
          python -m pytest -q --maxfail=1 tests/test_v2_genvm_direct.py tests/test_phase7_method_dispatch_compat.py
          echo SE_V2_PINNED_GENVM_DEPOSIT_GATE_PASS
