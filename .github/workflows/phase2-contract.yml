name: Phase 2 contract syntax and GenVM lint
on:
  push:
    branches:
      - build/phase2-genvm-contract-20261015
    paths:
      - 'contracts/**'
      - 'tests/**'
      - 'spec/**'
      - 'tools/**'
      - '.github/workflows/phase2-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned GenLayer tooling
        run: python -m pip install genvm-linter==0.11.0 genlayer-test==0.30.0rc2 pytest==9.1.1
      - name: Python syntax and SDK linter
        run: |
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: Unit and GenVM Direct tests
        run: python -m pytest -q tests
      - name: Stage 1 consistency
        run: node tools/check_phase1_design.mjs
