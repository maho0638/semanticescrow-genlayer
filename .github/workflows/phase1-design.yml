name: Phase 1 design specification checks
on:
  push:
    branches:
      - design/phase1-semantic-escrow-20261015
    paths:
      - 'spec/**'
      - 'tools/check_phase1_design.mjs'
      - '.github/workflows/phase1-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Architecture consistency only (no contract execution)
        run: |
          node --version
          node tools/check_phase1_design.mjs
