name: Phase 4 GEN escrow financial safety
on:
  push:
    branches: [audit/phase4-payment-refund-safety-20261015]
    paths:
      - 'contracts/**'
      - 'tests/**'
      - '.github/workflows/phase4-finance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-unit-and-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runner/linter/tests
        run: python -m pip install genlayer-test==0.30.0rc2 genvm-linter==0.11.0 cloudpickle==3.1.2 pytest==9.1.1
      - name: Build and verify GenVM Python compatibility
        run: |
          python -m compileall -q contracts tests
          genvm-lint lint contracts/semantic_escrow.py --json
      - name: Full direct finance and historical regression
        run: python -m pytest -q tests/test_phase2_contract.py tests/test_phase4_payment.py
      - name: Design static invariants
        run: node tools/check_phase1_design.mjs
